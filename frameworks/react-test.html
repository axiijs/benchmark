<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React 18 Performance Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #282c34; color: #61dafb; }
        h1 { color: #61dafb; }
        .controls { margin: 20px 0; }
        button { 
            background: #61dafb; 
            color: #282c34; 
            border: none; 
            padding: 10px 20px; 
            margin: 5px; 
            cursor: pointer; 
            font-weight: bold;
            border-radius: 5px;
        }
        button:hover { background: #4fa8c5; }
        #results { 
            background: #1e2127; 
            padding: 20px; 
            border-radius: 10px; 
            margin-top: 20px;
            white-space: pre-wrap;
        }
        .metric { color: #ffc107; font-weight: bold; }
        #app { 
            max-height: 400px; 
            overflow-y: auto; 
            border: 1px solid #61dafb; 
            padding: 10px;
            margin: 20px 0;
            border-radius: 5px;
        }
        .item {
            padding: 5px;
            margin: 2px 0;
            background: #3a3f47;
            border-radius: 3px;
            cursor: pointer;
        }
        .item:hover { background: #4a4f57; }
        .item.selected { background: #61dafb; color: #282c34; }
    </style>
</head>
<body>
    <h1>⚛️ React 18 Performance Benchmark</h1>
    
    <div class="controls">
        <button onclick="runBenchmark('create', 100)">Create 100</button>
        <button onclick="runBenchmark('create', 1000)">Create 1000</button>
        <button onclick="runBenchmark('create', 5000)">Create 5000</button>
        <button onclick="runBenchmark('append', 100)">Append 100</button>
        <button onclick="runBenchmark('update', 100)">Update 100</button>
        <button onclick="runBenchmark('remove', 100)">Remove 100</button>
        <button onclick="runBenchmark('clear')">Clear</button>
        <button onclick="runBenchmark('sort')">Sort</button>
        <button onclick="runBenchmark('swap')">Swap</button>
        <button onclick="runFullBenchmark()">Run Full Benchmark</button>
    </div>

    <div id="app"></div>
    <div id="results"></div>

    <!-- React 18 with Production build -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    
    <script type="text/babel" data-presets="react">
        const { useState, useCallback, useRef, useEffect } = React;
        const { createRoot } = ReactDOM;

        // React List Component
        function ListComponent({ onReady }) {
            const [items, setItems] = useState([]);
            const [selectedId, setSelectedId] = useState(null);
            const nextId = useRef(0);

            // Expose methods to parent
            useEffect(() => {
                if (onReady) {
                    onReady({
                        create: (count) => {
                            const newItems = [];
                            for (let i = 0; i < count; i++) {
                                newItems.push({
                                    id: nextId.current++,
                                    label: `Item ${nextId.current} - ${Math.random().toString(36).substr(2, 9)}`
                                });
                            }
                            setItems(newItems);
                        },
                        append: (count) => {
                            setItems(prev => {
                                const newItems = [...prev];
                                for (let i = 0; i < count; i++) {
                                    newItems.push({
                                        id: nextId.current++,
                                        label: `Appended ${nextId.current}`
                                    });
                                }
                                return newItems;
                            });
                        },
                        update: (count) => {
                            setItems(prev => {
                                const newItems = [...prev];
                                for (let i = 0; i < count && i < newItems.length; i++) {
                                    const idx = Math.floor(Math.random() * newItems.length);
                                    newItems[idx] = {
                                        ...newItems[idx],
                                        label: `Updated ${Date.now()}`
                                    };
                                }
                                return newItems;
                            });
                        },
                        remove: (count) => {
                            setItems(prev => {
                                let newItems = [...prev];
                                for (let i = 0; i < count && newItems.length > 0; i++) {
                                    const idx = Math.floor(Math.random() * newItems.length);
                                    newItems.splice(idx, 1);
                                }
                                return newItems;
                            });
                        },
                        clear: () => {
                            setItems([]);
                        },
                        sort: () => {
                            setItems(prev => [...prev].sort((a, b) => a.label.localeCompare(b.label)));
                        },
                        swap: () => {
                            setItems(prev => {
                                if (prev.length >= 2) {
                                    const newItems = [...prev];
                                    const idx1 = Math.floor(Math.random() * newItems.length);
                                    const idx2 = Math.floor(Math.random() * newItems.length);
                                    [newItems[idx1], newItems[idx2]] = [newItems[idx2], newItems[idx1]];
                                    return newItems;
                                }
                                return prev;
                            });
                        }
                    });
                }
            }, [onReady]);

            const handleSelect = useCallback((id) => {
                setSelectedId(id);
            }, []);

            return (
                <div>
                    <div>Items: {items.length}</div>
                    <div className="list">
                        {items.map(item => (
                            <div
                                key={item.id}
                                className={`item ${selectedId === item.id ? 'selected' : ''}`}
                                onClick={() => handleSelect(item.id)}
                            >
                                {item.label}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // Benchmark runner
        let root = null;
        let api = null;

        function setupReact() {
            return new Promise((resolve) => {
                const container = document.getElementById('app');
                if (root) {
                    root.unmount();
                }
                root = createRoot(container);
                root.render(
                    <ListComponent onReady={(methods) => {
                        api = methods;
                        resolve();
                    }} />
                );
            });
        }

        function measure(name, fn, iterations = 100) {
            const times = [];
            
            // Warmup
            for (let i = 0; i < 10; i++) fn();
            
            // Measure
            for (let i = 0; i < iterations; i++) {
                const start = performance.now();
                fn();
                const end = performance.now();
                times.push(end - start);
            }
            
            const sorted = times.sort((a, b) => a - b);
            return {
                name,
                mean: times.reduce((a, b) => a + b, 0) / times.length,
                median: sorted[Math.floor(sorted.length / 2)],
                min: sorted[0],
                max: sorted[sorted.length - 1],
                p95: sorted[Math.floor(sorted.length * 0.95)]
            };
        }

        async function runBenchmark(operation, count) {
            const results = document.getElementById('results');
            results.innerHTML = 'Setting up React...\n';
            
            await setupReact();
            await new Promise(r => setTimeout(r, 100)); // Let React settle
            
            results.innerHTML += `Running ${operation} benchmark...\n\n`;
            
            // Prepare test
            if (operation !== 'create' && operation !== 'clear') {
                api.create(1000); // Create initial data
                await new Promise(r => setTimeout(r, 100));
            }
            
            // Run benchmark
            const result = measure(`React ${operation}`, () => {
                switch(operation) {
                    case 'create': api.create(count || 1000); break;
                    case 'append': api.append(count || 100); break;
                    case 'update': api.update(count || 100); break;
                    case 'remove': api.remove(count || 100); break;
                    case 'clear': api.clear(); break;
                    case 'sort': api.sort(); break;
                    case 'swap': api.swap(); break;
                }
            });
            
            results.innerHTML += `<span class="metric">Results for ${operation}:</span>\n`;
            results.innerHTML += `  Mean:   ${result.mean.toFixed(3)}ms\n`;
            results.innerHTML += `  Median: ${result.median.toFixed(3)}ms\n`;
            results.innerHTML += `  Min:    ${result.min.toFixed(3)}ms\n`;
            results.innerHTML += `  Max:    ${result.max.toFixed(3)}ms\n`;
            results.innerHTML += `  P95:    ${result.p95.toFixed(3)}ms\n`;
            results.innerHTML += `  Ops/sec: ${(1000 / result.mean).toFixed(0)}\n`;
            
            return result;
        }

        async function runFullBenchmark() {
            const results = document.getElementById('results');
            results.innerHTML = '<span class="metric">Running Full React 18 Benchmark Suite...</span>\n\n';
            
            const allResults = {};
            const operations = [
                { op: 'create', count: 100 },
                { op: 'create', count: 1000 },
                { op: 'create', count: 5000 },
                { op: 'append', count: 100 },
                { op: 'update', count: 100 },
                { op: 'remove', count: 100 },
                { op: 'clear' },
                { op: 'sort' },
                { op: 'swap' }
            ];
            
            for (const { op, count } of operations) {
                const result = await runBenchmark(op, count);
                allResults[`${op}${count ? '_' + count : ''}`] = result;
                results.innerHTML += '\n';
                await new Promise(r => setTimeout(r, 100));
            }
            
            // Summary
            results.innerHTML += '\n<span class="metric">SUMMARY:</span>\n';
            const totalTime = Object.values(allResults).reduce((sum, r) => sum + r.mean, 0);
            results.innerHTML += `Total time for all operations: ${totalTime.toFixed(2)}ms\n`;
            
            // Key metrics
            results.innerHTML += '\n<span class="metric">Key Metrics:</span>\n';
            results.innerHTML += `Create 1000: ${allResults.create_1000.mean.toFixed(2)}ms\n`;
            results.innerHTML += `Update 100:  ${allResults.update_100.mean.toFixed(2)}ms\n`;
            results.innerHTML += `Swap 2:      ${allResults.swap.mean.toFixed(2)}ms\n`;
            
            console.log('React 18 Benchmark Results:', allResults);
        }

        window.runBenchmark = runBenchmark;
        window.runFullBenchmark = runFullBenchmark;
    </script>
    
    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
